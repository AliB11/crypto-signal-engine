name = "crypto-advanced-signal-scanner"
main = "src/worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# هر ۵ دقیقه یک کاوش سبک دسترس‌پذیری بالادستی (یک درخواست تیکر) انجام می‌شود.
# پیش‌تر "* * * * *" بود و هر دقیقه یک اسکن کامل ۱۰ نمادی در چند تایم‌فریم اجرا
# می‌کرد و نتیجه را دور می‌ریخت — روزانه چند صد هزار درخواست بالادستی برای
# گرم‌کردن کشی که TTL آن ۸ ثانیه است. جزئیات در `src/worker.ts` → `scheduled()`.
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
DEFAULT_TIMEFRAME = "15m"
PRIMARY_SOURCE = "binance"
